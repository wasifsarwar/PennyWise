# ============================================
# Pennywise - Docker Compose
# ============================================
# Usage:
#   Development: docker-compose up -d
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Rebuild:     docker-compose up -d --build
#   Logs:        docker-compose logs -f backend
#   Stop:        docker-compose down
#   Clean:       docker-compose down -v (removes volumes too)
# ============================================

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: pennywise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pennywise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pennywise}
      POSTGRES_DB: ${DB_NAME:-pennywise}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pennywise} -d ${DB_NAME:-pennywise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pennywise-network

  # ==========================================
  # Spring Boot Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pennywise-backend
    restart: unless-stopped
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-pennywise}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-pennywise}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-pennywise}
      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}
      # Server
      SERVER_PORT: 8080
      # Timezone
      TZ: ${TZ:-UTC}
      # JVM options (can be overridden)
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pennywise-network

# ==========================================
# Networks
# ==========================================
networks:
  pennywise-network:
    driver: bridge
    name: pennywise-network

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    name: pennywise-postgres-data
